<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Java Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body class="admin-body">

  <!-- PASSWORD OVERLAY -->
  <div id="passwordOverlay" style="position:fixed;inset:0;background:rgba(26,18,9,0.97);z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div style="background:#FAF6F0;border-radius:12px;padding:48px 40px;max-width:380px;width:90%;text-align:center;">
      <div style="font-size:40px;margin-bottom:16px;">🔒</div>
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:#1A1209;margin-bottom:8px;">Admin Access</h2>
      <p style="color:#6B6055;font-size:14px;margin-bottom:24px;">Enter your password to continue</p>
      <input id="passwordInput" type="password" placeholder="Password" style="width:100%;padding:12px 16px;border:1px solid #E8D5A3;border-radius:4px;font-size:15px;background:#fff;color:#1A1209;outline:none;margin-bottom:12px;"/>
      <p id="passwordError" style="display:none;color:#B72B1A;font-size:13px;margin-bottom:12px;">❌ Wrong password. Try again.</p>
      <button id="passwordSubmit" style="width:100%;background:#1A1209;color:#E8D5A3;border:none;padding:13px;border-radius:4px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;">Enter Admin</button>
    </div>
  </div>

  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <span class="logo-main">Java Perfume</span>
      <span class="logo-sub">Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="sn-item active" data-tab="products"><span class="sn-icon">🌸</span> Products</a>
      <a href="../index.html" class="sn-item sn-external"><span class="sn-icon">🏪</span> View Shop</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="tab-pane active" id="tab-products">
      <div class="admin-topbar">
        <div>
          <h1 class="admin-title">Products</h1>
          <p class="admin-subtitle">Manage your fragrance collection</p>
        </div>
        <button class="btn-add" id="btnAddProduct">+ Add New Fragrance</button>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Fragrance</th>
              <th>Notes</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-overlay" id="productModal">
    <div class="modal admin-modal">
      <button class="modal-close" id="productModalClose">✕</button>
      <h3 class="modal-title" id="productModalTitle">Add New Fragrance</h3>
      <div class="modal-grid">

        <!-- IMAGE UPLOAD -->
        <div class="form-group full">
          <label>Product Photo</label>
          <div class="image-upload-box" id="imageUploadBox">
            <img id="imagePreview" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:8px;"/>
            <div id="imageUploadPlaceholder">
              <div style="font-size:36px;margin-bottom:8px;">📷</div>
              <p style="color:#6B6055;font-size:13px;">Click to upload a photo</p>
              <p style="color:#9E8E7E;font-size:11px;">JPG, PNG — max 5MB</p>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;"/>
          </div>
          <p id="imageStatus" style="font-size:12px;color:#6B6055;margin-top:6px;"></p>
        </div>

        <div class="form-group">
          <label>Fragrance Name *</label>
          <input type="text" id="pName" placeholder="e.g. Oud Noir Absolu"/>
        </div>
        <div class="form-group">
          <label>Price *</label>
          <input type="number" id="pPrice" placeholder="e.g. 150" min="0"/>
        </div>
        <div class="form-group full">
          <label>Scent Notes</label>
          <input type="text" id="pNotes" placeholder="e.g. Oud · Rose · Musk"/>
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="pDesc" placeholder="Describe the fragrance..."></textarea>
        </div>
        <div class="form-group">
          <label>Badge (optional)</label>
          <input type="text" id="pBadge" placeholder="New / Limited / Bestseller"/>
        </div>
        <div class="form-group">
          <label>Available in Shop</label>
          <select id="pAvailable">
            <option value="true">Yes — Show to customers</option>
            <option value="false">No — Hide</option>
          </select>
        </div>
      </div>
      <input type="hidden" id="pEditId"/>
      <input type="hidden" id="pExistingImage"/>
      <div id="saveError" style="display:none;color:#B72B1A;font-size:13px;margin-bottom:12px;"></div>
      <button class="btn-save" id="btnSaveProduct">Save Fragrance</button>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width:380px;text-align:center;">
      <button class="modal-close" id="deleteModalClose">✕</button>
      <div style="font-size:48px;margin-bottom:16px;">🗑️</div>
      <h3 class="modal-title" style="margin-bottom:8px;">Remove Fragrance?</h3>
      <p style="color:var(--smoke);margin-bottom:28px;" id="deleteProductName"></p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn-cancel" id="deleteCancel">Cancel</button>
        <button class="btn-delete" id="deleteConfirm">Yes, Remove</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
